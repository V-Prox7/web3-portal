<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet - Node Validator Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f2e 0%, #1a1a3f 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #b0b0b0;
            font-size: 1.1rem;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.7rem 1.5rem;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.5);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            transform: translateX(-5px);
        }

        .wallets-section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: #00d4ff;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid #00d4ff;
            padding-left: 1rem;
        }

        .wallets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .wallet-card {
            background: rgba(30, 30, 60, 0.8);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .wallet-card:hover {
            background: rgba(30, 30, 60, 0.95);
            border-color: #00d4ff;
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 212, 255, 0.25);
        }

        .wallet-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
        }

        .wallet-name {
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            word-break: break-word;
        }

        .wallet-card:hover .wallet-name {
            color: #00d4ff;
        }

        .wallet-cta {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: #b0b0b0;
        }
